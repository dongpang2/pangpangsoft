<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팡팡소프트 — Pangpang Soft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f7;
      color: #1d1d1f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      text-align: center;
    }
    .logo-mark {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6e6e73;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 36px;
      font-weight: 800;
      color: #1d1d1f;
      margin-bottom: 16px;
    }
    .desc {
      font-size: 17px;
      color: #6e6e73;
      max-width: 460px;
      line-height: 1.7;
      margin-bottom: 48px;
    }
    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .link-btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .link-btn:hover { opacity: 0.75; }
    .link-btn.primary {
      background: #1d1d1f;
      color: #fff;
    }
    .link-btn.secondary {
      background: #fff;
      color: #1d1d1f;
      border: 1px solid #d2d2d7;
    }
    footer {
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: #8e8e93;
      border-top: 1px solid #d2d2d7;
    }
    footer a {
      color: #8e8e93;
      text-decoration: none;
      margin: 0 8px;
    }
    footer a:hover { color: #1d1d1f; }
  </style>
</head>
<body>

  <div class="hero">
    <div class="logo-mark">🎮</div>
    <div class="brand">Pangpang Soft · 팡팡소프트</div>
    <h1>신나는 게임을<br>만들어요</h1>
    <p class="desc">
      팡팡소프트는 토스 앱인토스 플랫폼에서<br>
      하이퍼캐주얼 게임을 개발합니다.
    </p>
    <div class="links">
      <a href="https://toss.im" class="link-btn primary">토스에서 플레이</a>
      <a href="mailto:kdhdoo2@gmail.com" class="link-btn secondary">문의하기</a>
    </div>
  </div>

  <footer>
    © 2026 팡팡소프트. All rights reserved.
    <br style="display: none;">
    <a href="./privacy.html">개인정보처리방침</a>
    <a href="./terms.html">이용약관</a>
  </footer>

</body>
</html>
